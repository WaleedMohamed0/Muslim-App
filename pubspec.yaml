name: muslim
description: A Muslim companion app for Quran, azkar, prayer times, and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  quran: ^1.4.1
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  geolocator: ^14.1.2
  flutter_compass: ^0.8.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  responsive_sizer: ^3.3.1
  awesome_dialog: ^3.3.0
  page_transition: ^2.2.2
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^19.4.2
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1
  internet_connection_checker: ^3.0.1
  flutter_cache_manager: ^3.4.6
  path_provider: ^2.1.6
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/features/app/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/features/app/images/quran_logo.webp
    - assets/features/asmaa_allah/
    - assets/features/azkar/data/azkar.json
    - assets/images/azkar/
    - assets/features/prayer_times/audio/
    - assets/features/prayer_times/images/
    - assets/features/quran/data/
    - assets/images/reciters/
    # Bundles static worship lesson illustrations.
    - assets/features/worship/illustrations/
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/features/quran/fonts/UthmanicHafs-v-3.0.ttf
